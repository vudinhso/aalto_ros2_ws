ekf_filter_node:
    ros__parameters:
      frequency: 30.0
      two_d_mode: true
      publish_tf: true
      use_sim_time: false #true
      map_frame: map              # Defaults to "map" if unspecified
      odom_frame: odom            # Defaults to "odom" if unspecified
      base_link_frame: base_footprint # Base of the robot
      world_frame: odom           # Defaults to the value of odom_frame if unspecified

      # IMU Configuration
      # imu0 : /imu/out # This is the IMU topic published by the IMU driver (gazebo pluggin or real IMU)
      # imu0 : /imu_sensor_broadcaster/imu
      imu0 : /imu/data
      imu0_relative: true
      imu0_config: [false, false, false,
                    true, true, true,
                    false, false, false,
                    false, false, true,
                    false,  false, false]
      imu0_differential: false
      imu0_pose_use_child_frame: false
      # imu0_config: [x, y, z,
      #               roll, pitch, yaw,
      #               vx, vy, vz,
      #               vroll, vpitch, vyaw,
      #               ax, ay, az] set true to use the value. Set false to ignore the value.

      odom0: /odom
      odom0_config: [true, true, false,     # x, y, z
                     false, false, true,    # roll, pitch, yaw
                     true,  true,  false,   # vx, vy, vz
                     false, false, true,    # vroll, vpitch, vyaw
                     false, false, false]   # ax, ay, az

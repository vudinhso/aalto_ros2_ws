/**:
    ros__parameters:
      video_device: "/dev/video2"
      framerate: 30.0
      io_method: "mmap"
      frame_id: "camera"
      # pixel_format: "mjpeg2rgb"  # see usb_cam/supported_formats for list of supported formats
      pixel_format: "mjpeg2rgb"
      av_device_format: "YUV420P" #"YUV422P"
      image_width: 640 #640
      image_height: 480 #480
      camera_name: "test_camera"
      # camera_info_url: "package://usb_cam/config/camera_info.yaml"
      # brightness: 10
      # contrast: 20
      # saturation: 70
      brightness: -1
      contrast: -1
      saturation: -1
      sharpness: -1
      gain: -1
      auto_white_balance: true
      white_balance: 4000
      autoexposure: true
      exposure: 100
      autofocus: false
      focus: -1